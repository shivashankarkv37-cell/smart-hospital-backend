spring.application.name=smart-hospital-backend
server.port=${SERVER_PORT:8080}

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_hospital?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# CORS
# ===============================
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET:VNWxBHQJVSP1nPZMTOSbRT9hNknmj9tgk2lOci20v6s=}
app.jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}

app.assistant.enabled=${ASSISTANT_ENABLED:true}
